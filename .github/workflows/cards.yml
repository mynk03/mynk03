name: Profile Cards

on:
  schedule:
    - cron: '13 3 * * *'  # 08:43 IST daily
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      USER_NAME: mynk03
      LEETCODE_USER: mynk03
      # shared palette: card bg, title/ring, icons, text
      BG: '151515'
      ACCENT: 'C13CCC'
      ICON: 'E4572E'
      TEXT: 'E6EDF3'
    steps:
      - uses: actions/checkout@v7

      # A failed card keeps the previous SVG instead of writing an error card.
      - name: Stats card
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ env.USER_NAME }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&border_radius=10&bg_color=${{ env.BG }}&title_color=${{ env.ACCENT }}&ring_color=${{ env.ACCENT }}&icon_color=${{ env.ICON }}&text_color=${{ env.TEXT }}
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ env.USER_NAME }}&layout=compact&langs_count=8&hide_border=true&border_radius=10&bg_color=${{ env.BG }}&title_color=${{ env.ACCENT }}&text_color=${{ env.TEXT }}
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Streak and LeetCode cards
        run: |
          fetch() {
            local url=$1 out=$2 tmp
            tmp=$(mktemp)
            if curl -fsSL --retry 3 --max-time 60 "$url" -o "$tmp" \
              && grep -q '<svg' "$tmp" && ! grep -qiE 'something went wrong|not found' "$tmp"; then
              mv "$tmp" "$out"
            else
              echo "::warning::could not fetch $out, keeping previous version"
            fi
          }
          mkdir -p profile
          fetch "https://streak-stats.demolab.com/?user=${USER_NAME}&hide_border=true&border_radius=10&background=${BG}&stroke=${ACCENT}&ring=${ACCENT}&fire=${ICON}&currStreakNum=${TEXT}&sideNums=${TEXT}&currStreakLabel=${TEXT}&sideLabels=${TEXT}&dates=8B949E" profile/streak.svg
          fetch "https://leetcard.jacoblin.cool/${LEETCODE_USER}?theme=dark&font=Inter&border=0&radius=10&ext=heatmap" profile/leetcode.svg
          fetch "https://capsule-render.vercel.app/api?type=waving&color=0:150a17,35:7a2a80,70:${ACCENT},100:${ICON}&height=200&section=header&text=Mayank%20Yadav&fontSize=60&fontColor=ffffff&fontAlignY=34&desc=Full%20Stack%20Developer%20%7C%20TypeScript%2C%20Node.js%2C%20React%20%26%20Next.js&descSize=20&descAlignY=56&animation=fadeIn" profile/header.svg
          fetch "https://capsule-render.vercel.app/api?type=waving&color=0:${ICON},30:${ACCENT},70:7a2a80,100:150a17&height=110&section=footer" profile/footer.svg
          fetch "https://readme-typing-svg.demolab.com?font=Kanit&weight=600&size=24&duration=3000&pause=800&color=${ACCENT}&center=true&vCenter=true&width=620&lines=TypeScript+%26+Node.js+microservices;React+%26+Next.js+products;Payments%2C+queues+%26+real-time+systems;Go+services%2C+AI+agents+%26+Web3" profile/typing.svg

      - name: Activity graph
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tmp=$(mktemp)
          python3 -I scripts/activity_graph.py "$USER_NAME" "$tmp" && mv "$tmp" profile/activity.svg

      - name: Commit if cards changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "No card changes."
            exit 0
          fi
          git commit -m "chore(cards): update profile cards"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing (attempt $i)..."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
