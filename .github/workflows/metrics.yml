name: Profile Metrics

on:
  schedule:
    - cron: '13 3 * * *'  # 08:43 IST daily
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip without METRICS_TOKEN
        if: env.HAS_TOKEN != 'true'
        run: echo "METRICS_TOKEN secret not set; skipping metrics."

      - uses: lowlighter/metrics@latest
        if: env.HAS_TOKEN == 'true'
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mynk03
          template: classic
          config_timezone: Asia/Kolkata
          filename: github-metrics.svg
          base: "activity, community, repositories, metadata"
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: none

      - name: Commit if SVG changed
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # output_action: none leaves the render in /metrics_renders, not the workspace
          sudo cp /metrics_renders/github-metrics.svg github-metrics.svg
          sudo chown "$(id -u):$(id -g)" github-metrics.svg
          git add github-metrics.svg
          if git diff --staged --quiet; then
            echo "No SVG changes."
            exit 0
          fi
          git commit -m "chore(metrics): update profile metrics svg"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing (attempt $i)..."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
